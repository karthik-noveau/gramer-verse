<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 40"
     width="178" height="40" role="img" aria-label="Grammer-Verse · கிராமர்-வெர்ஸ்">
  <!--
    The full logo: mark, name, and the name as a Tamil reader would say it.

    The product is English taught in Tamil, so a logo in one script tells half
    the story. Latin leads because the subject is English; the Tamil line is
    smaller and muted because it is the pronunciation, not a second name — the
    same transliteration bridge the lessons themselves use.

    Both wordmarks are outlines rather than live text. assets/fonts/README.md
    records that this prototype ships no Tamil webfont and that the system
    stack degrades to empty boxes where one is missing; a wordmark that can
    render as tofu is not a wordmark. The Tamil is Tamil Sangam MN converted
    to a path, so it needs no font at all.

    assets/js/logo.js draws the same thing from custom properties where the
    logo must follow the page theme. This file is the record.
  -->
  <style>
    .frame { stroke: #17160f; }
    .ball  { fill:   #2f6f4f; }
    .name  { fill:   #17160f; font: 600 19px/1 Georgia, "Iowan Old Style", serif;
              letter-spacing: -.015em; }
    .name .v { fill: #2f6f4f; }
    .ta    { fill:   #6c6a62; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #f2f1ec; }
      .ball  { fill:   #7dc4a0; }
      .name  { fill:   #f2f1ec; }
      .name .v { fill: #7dc4a0; }
      .ta    { fill:   #918e84; }
    }
  </style>

  <g transform="translate(0,4)">
    <path class="frame" d="M11 4 H7.5 A3.5 3.5 0 0 0 4 7.5 V24.5 A3.5 3.5 0 0 0 7.5 28 H24.5 A3.5 3.5 0 0 0 28 24.5 V7.5 A3.5 3.5 0 0 0 24.5 4 H21" fill="none" stroke-width="3" stroke-linecap="round"/>
    <circle class="ball" cx="16" cy="19" r="6"/>
  </g>

  <text class="name" x="44" y="22">Grammer<tspan class="v">-Verse</tspan></text>

